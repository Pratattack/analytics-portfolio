name: SEC Working Capital CI
on:
  push:
    paths:
      - 'sec-working-capital/**'
      - '.github/workflows/sec-working-capital-ci.yml'
  pull_request:
    paths:
      - 'sec-working-capital/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sec-working-capital
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/analysis.py
      - run: python scripts/load_sqlite.py
      - run: python -m compileall -q app.py scripts tests
