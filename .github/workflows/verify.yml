name: Verify portfolio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  finance-empirical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/2026-10-20/requirements.txt
      - name: Install pinned finance dependencies
        run: python -m pip install -r projects/2026-10-20/requirements.txt
      - name: Verify source lineage, independent methods and clean reproducibility
        run: python projects/2026-10-20/verify_all.py

  finance-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned analysis dependencies and rebuild applications
        run: |
          python -m pip install -r projects/2026-10-20/requirements.txt
          python projects/2026-10-20/presentation.py
      - name: Install pinned real-browser runtime
        run: |
          npm install --prefix .browser-runner playwright@1.56.1
          ./.browser-runner/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Test both applications and reports on desktop and mobile in three engines
        run: NODE_PATH="$PWD/.browser-runner/node_modules" node projects/2026-10-20/browser_test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance-browser-evidence
          path: projects/2026-10-20/browser_evidence/
          retention-days: 30

  finance-public-snapshot:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [finance-empirical-research, finance-browser-acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: finance-browser-evidence
          path: finance-browser-evidence
      - name: Validate actual acceptance evidence and package screenshots
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          root = Path('finance-browser-evidence')
          result = json.loads((root / 'results.json').read_text())
          assert result['status'] == 'PASS' and len(result['results']) == 24
          assert all(row['status'] == 'PASS' and (root / row['screenshot']).is_file() for row in result['results'])
          shutil.make_archive('finance-browser-evidence', 'zip', root)
          PY
      - name: Publish commit-specific passing browser evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot_tag="finance-research-2026-10-20-${GITHUB_SHA:0:12}"
          if ! gh release view "$snapshot_tag" >/dev/null 2>&1; then
            gh release create "$snapshot_tag" finance-browser-evidence.zip finance-browser-evidence/insurance-reserve-capital-review-chromium-desktop-app.png finance-browser-evidence/retail-reit-refinancing-review-chromium-desktop-app.png --target "$GITHUB_SHA" --title "Insurance and retail REIT finance diligence" --notes "Actual 24-case browser evidence: two reports and workbenches, Chromium/Firefox/WebKit, desktop/mobile. Numerical SEC snapshots, source lineage, code, methods and deterministic outputs are in the tagged source tree. No hosted service, reserve release, credit approval or current funding deficit is claimed."
          fi

  initial-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify initial October 17 cases
        working-directory: projects/2026-10-17
        run: python verify.py
  resilience-case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify resilience allocation
        working-directory: projects/2026-10-17/03-grid-resilience-capital-allocation
        run: python verify.py
  october18-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify healthcare and mobility cases
        working-directory: projects/2026-10-18
        run: python verify_all.py

  flagship-utility-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flagships/utility-reliability-due-diligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify pinned sources, data gates, methods, API and reproducibility
        run: python verify.py

  october19-empirical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/2026-10-19/requirements.txt
      - name: Install declared static-figure dependencies
        run: python -m pip install -r projects/2026-10-19/requirements.txt
      - name: Restore immutable official-data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download research-2026-10-19-6d3bd3a997d8 --pattern release_bundle.zip --dir "$RUNNER_TEMP/pinned-oct19"
          python projects/2026-10-19/restore_snapshot.py "$RUNNER_TEMP/pinned-oct19/release_bundle.zip"
      - name: Verify pinned sources, independent methods, clean rebuilds and static outputs
        run: python projects/2026-10-19/verify_all.py

  flagship-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared flagship dependencies
        run: python -m pip install -r flagships/utility-reliability-due-diligence/requirements.txt
      - name: Regenerate the offline workbench from current source
        run: python flagships/utility-reliability-due-diligence/export_workbench.py
      - name: Install pinned browser runtime and engines
        run: |
          npm install --prefix .browser-runner playwright@1.56.1
          ./.browser-runner/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Verify API and offline delivery in three engines on desktop and mobile
        run: NODE_PATH="$PWD/.browser-runner/node_modules" node flagships/utility-reliability-due-diligence/browser_test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flagship-browser-evidence
          path: flagships/utility-reliability-due-diligence/browser_evidence/
          retention-days: 30

  october19-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared analysis dependencies
        run: python -m pip install -r projects/2026-10-19/requirements.txt
      - name: Restore immutable official-data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download research-2026-10-19-6d3bd3a997d8 --pattern release_bundle.zip --dir "$RUNNER_TEMP/pinned-oct19"
          python projects/2026-10-19/restore_snapshot.py "$RUNNER_TEMP/pinned-oct19/release_bundle.zip"
      - name: Collect fingerprint-pinned official observations and build applications
        run: |
          python projects/2026-10-19/collect.py
          python projects/2026-10-19/airline-delay-intervention-screen/pipeline.py
          python projects/2026-10-19/bank-deposit-cost-attribution/pipeline.py
      - name: Install pinned browser test runtime
        run: npm install --prefix .browser-runner playwright@1.56.1
      - name: Install Chromium, Firefox and WebKit
        run: ./.browser-runner/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Test both reports on desktop and mobile in all three engines
        run: NODE_PATH="$PWD/.browser-runner/node_modules" node projects/2026-10-19/browser_test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: october19-browser-evidence
          path: projects/2026-10-19/browser_evidence/
          retention-days: 30

  flagship-browser-snapshot:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [flagship-utility-lab, flagship-browser-acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flagship-browser-evidence
          path: flagship-browser-evidence
      - name: Validate and archive actual browser evidence
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          root = Path('flagship-browser-evidence')
          result = json.loads((root / 'results.json').read_text())
          assert result['status'] == 'PASS' and len(result['results']) == 12
          assert all(row['status'] == 'PASS' and (root / row['screenshot']).is_file() for row in result['results'])
          shutil.make_archive('flagship-browser-evidence', 'zip', root)
          PY
      - name: Publish immutable browser evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot_tag="flagship-browser-2026-10-20-${GITHUB_SHA:0:12}"
          if ! gh release view "$snapshot_tag" >/dev/null 2>&1; then
            gh release create "$snapshot_tag" flagship-browser-evidence.zip --target "$GITHUB_SHA" --title "Utility workbench browser acceptance" --notes "Twelve real-browser cases: API/offline delivery, Chromium/Firefox/WebKit, desktop/mobile. Includes actual screenshots and results.json. Physical devices, screen readers and engineering validation are outside scope. Research quarantine and model promotion gates remain unchanged."
          fi

  october19-public-snapshot:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [october19-empirical-research, october19-browser-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: python -m pip install -r projects/2026-10-19/requirements.txt
      - name: Restore immutable official-data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download research-2026-10-19-6d3bd3a997d8 --pattern release_bundle.zip --dir "$RUNNER_TEMP/pinned-oct19"
          python projects/2026-10-19/restore_snapshot.py "$RUNNER_TEMP/pinned-oct19/release_bundle.zip"
      - name: Recreate fingerprint-verified source observations and outputs
        run: |
          python projects/2026-10-19/collect.py
          python projects/2026-10-19/airline-delay-intervention-screen/pipeline.py
          python projects/2026-10-19/bank-deposit-cost-attribution/pipeline.py
      - uses: actions/download-artifact@v4
        with:
          name: october19-browser-evidence
          path: projects/2026-10-19/browser_evidence
      - name: Package only this commit's public data, applications and passing browser evidence
        run: python projects/2026-10-19/package_release.py
      - name: Publish an immutable commit-specific public snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot_tag="research-2026-10-19-${GITHUB_SHA:0:12}"
          if gh release view "$snapshot_tag" >/dev/null 2>&1; then
            echo "Existing snapshot retained; no files overwritten."
          else
            gh release create "$snapshot_tag" projects/2026-10-19/release_bundle.zip projects/2026-10-19/browser_evidence/airline-delay-intervention-screen-chromium-desktop-app.png projects/2026-10-19/browser_evidence/bank-deposit-cost-attribution-chromium-desktop-app.png --target "$GITHUB_SHA" --title "Verified economics and airline research snapshot" --notes "Official public source observations, complete outputs, offline interactive workbenches and 24 passing browser cases. See SNAPSHOT_MANIFEST.json for member hashes and exact commit. Application screenshots are also attached separately. No employer data, hosted service or causal effect is claimed."
          fi
