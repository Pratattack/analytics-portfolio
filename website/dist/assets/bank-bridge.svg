<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 305" role="img" aria-labelledby="t desc"><title id="t">What changed bank deposit expense?</title><desc id="desc">Screened quarterly deposit interest expense changed by minus 5.012 billion dollars. Balance growth added 5.242 billion, interest-bearing mix added 0.057 billion and the proxy-rate effect subtracted 10.310 billion. Accounting attribution, not causal effects.</desc><rect width="660" height="305" fill="#111e2c"/><g font-family="Inter,Arial,sans-serif"><text x="18" y="25" fill="#a9bfd7" font-size="11">Quarterly expense change · USD billions</text><line x1="470" y1="45" x2="470" y2="257" stroke="#7b91aa" stroke-width="1"/><text x="18" y="75" fill="#c7d3df" font-size="12">Balance growth</text><rect x="470.00" y="60" width="120.56" height="23" fill="#9dbfe3"/><text x="625" y="76" fill="#e8eef4" font-size="13" text-anchor="end">+5.24</text><text x="18" y="130" fill="#c7d3df" font-size="12">Interest-bearing mix</text><rect x="470.00" y="115" width="1.30" height="23" fill="#9dbfe3"/><text x="625" y="131" fill="#e8eef4" font-size="13" text-anchor="end">+0.06</text><text x="18" y="185" fill="#c7d3df" font-size="12">Proxy-rate effect</text><rect x="232.87" y="170" width="237.13" height="23" fill="#6482a4"/><text x="625" y="186" fill="#e8eef4" font-size="13" text-anchor="end">-10.31</text><text x="18" y="240" fill="#c7d3df" font-size="12">Total change</text><rect x="354.73" y="225" width="115.27" height="23" fill="#6482a4"/><text x="625" y="241" fill="#e8eef4" font-size="13" text-anchor="end">-5.01</text><text x="194" y="283" fill="#91a9c2" font-size="10">−12</text><text x="466" y="283" fill="#91a9c2" font-size="10">0</text><text x="601" y="283" fill="#91a9c2" font-size="10">+6</text></g></svg>